version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: basketball-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: basketball_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports exposed to host — fully isolated inside Docker network

  redis:
    image: redis:7-alpine
    container_name: basketball-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports exposed to host — fully isolated inside Docker network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: basketball-backend
    env_file:
      - ./server/.env.development
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - ./shared:/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: uncomment to enable Adminer for database GUI access
  # adminer:
  #   image: adminer
  #   container_name: basketball-adminer
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
  redis_data:
